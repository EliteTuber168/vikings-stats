<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vikings Stat Book</title>
<meta name="description" content="Season stats for the Vikings in Universe Football.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}
/* Layout: stadium-night stat book — season strip, leader boards, tabbed stat tables, game log + CSV drop. Single dark look by choice. */
:root{
  --bg:#0c0717; --panel:#160e28; --panel2:#1e1436; --line:#33255a; --fg:#efeaf8; --mute:#a99ec6;
  --accent:#9b5cff; --accent2:#6f33e0; --gold:#ffc62f; --good:#5fd38a; --bad:#ff6b7a;
  --display:"Permanent Marker","Comic Sans MS",cursive; --num:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;font-weight:500;line-height:1.4}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(155,92,255,.28),transparent 70%)}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.eyebrow{font-size:13px;letter-spacing:.42em;color:var(--gold);font-weight:700;text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,76px);line-height:1;transform:rotate(-2deg);text-shadow:0 4px 0 var(--accent2),0 8px 18px rgba(0,0,0,.6);text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--mute);font-size:15px;letter-spacing:.06em}
h2{margin:0;font-family:var(--num);font-weight:400;font-size:30px;letter-spacing:.08em;line-height:1}
h2 small{font-family:var(--body);font-size:14px;color:var(--mute);letter-spacing:.1em;margin-left:10px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--num);font-weight:400;font-size:44px;line-height:1}
.tile span{font-size:13px;letter-spacing:.16em;color:var(--mute);font-weight:700;text-transform:uppercase}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lcard h3{margin:0;font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
.lrow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px}
.lrow .jn{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,var(--accent),var(--accent2));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:20px;padding-top:2px}
.lrow:not(:first-of-type) .jn{background:var(--panel2);border-color:var(--line);font-size:18px}
.lrow .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .v{font-family:var(--num);font-size:28px;line-height:1}
.lrow:first-of-type .v{color:var(--gold)}
.muted{color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{color:#140a26;background:var(--gold);border-color:var(--gold)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:700;text-transform:uppercase;cursor:pointer;user-select:none}
th.sorted{color:var(--gold)} th.sorted::after{content:" ▾"}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:700}
td .jn{display:inline-block;min-width:30px;font-family:var(--num);color:var(--gold);font-size:18px}
tbody tr:hover{background:rgba(155,92,255,.08)}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.games{display:flex;flex-direction:column;gap:10px}
.game{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.gtitle{font-family:var(--num);font-size:24px;letter-spacing:.04em;line-height:1}
.gmeta{font-size:14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg);background:rgba(255,255,255,.03)}
.btn{font:inherit;font-weight:700;letter-spacing:.08em;font-size:14px;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#140a26}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:700;text-transform:uppercase;flex:1 1 150px;min-width:0}
input[type=text],input[type=date],input[type=number]{font:inherit;font-size:16px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.checks label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
.checks label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks label.on{border-color:var(--accent);background:rgba(155,92,255,.12)}
.checks input{accent-color:var(--accent)}
.drop{border:2px dashed var(--accent);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(155,92,255,.06);cursor:pointer}
.drop.over{background:rgba(155,92,255,.18)}
.drop b{font-family:var(--num);font-size:26px;letter-spacing:.06em;font-weight:400}
.note{font-size:14px;color:var(--mute)}
.msg{font-size:14px;font-weight:700}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
.roster td input{max-width:160px}
.roster td input[type=number]{max-width:80px}
footer{text-align:center;color:var(--mute);font-size:13px;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
  <header>
    <div class="eyebrow">Universe Football · 2026 Season</div>
    <h1>VIKINGS <span>STAT BOOK</span></h1>
    <div class="sub" id="sub">Loading season…</div>
  </header>
  <section class="strip" id="strip" aria-label="Season totals"></section>
  <section class="panel"><h2>Season Leaders</h2><div class="leaders" id="leaders"></div></section>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>Player Stats</h2><div class="tabs" role="tablist" id="tabs"></div></div>
    <div class="tscroll" id="table"></div>
    <div class="note">Tap a column to sort. Only players who played for the Vikings in each game count.</div>
  </section>
  <section class="panel"><h2>Game Log <small id="gcount"></small></h2><div class="games" id="games"></div></section>
  <footer id="foot">Stats update automatically when a new game file is added.</footer>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let games = [], roster = {}, tab = "passing", sortKey = null;
  const SECS = ["Passing","Rushing","Receiving","Cornerback","DLine","SpecialTeams"];
  function parseCSV(text){
    const out = {}; let sec = null, head = null;
    for (const raw of text.replace(/\r/g,"").split("\n")){
      const line = raw.trim(); if (!line) continue;
      const bare = line.replace(/,+$/,"").replace(/^"|"$/g,"");
      if (SECS.includes(bare)){ sec = bare; head = null; continue; }
      const cells = line.split(",").map(c => c.replace(/^"|"$/g,"").trim());
      if (cells[0] === "Username"){ head = cells; continue; }
      if (!sec || !head || !cells[0]) continue;
      const row = {}; head.forEach((h,i) => row[h] = cells[i]);
      const u = cells[0], p = out[u] || (out[u] = {});
      const N = h => { const v = parseFloat(row[h]); return isFinite(v) ? v : 0; };
      const add = (k,v) => { if (v) p[k] = (p[k]||0) + v; };
      if (sec === "Passing"){ add("cmp",N("Completions")); add("att",N("Attempts")); add("pyd",N("Passing Yards")); add("ptd",N("Touchdowns")); add("pint",N("Interceptions")); add("sk",N("Sacks Taken")); }
      else if (sec === "Rushing"){ add("ra",N("Rushing Attempts")); add("ryd",N("Rushing Yards")); add("rtd",N("Touchdowns")); }
      else if (sec === "Receiving"){ add("rec",N("Receptionss")+N("Receptions")); add("tgt",N("Targets")); add("cyd",N("Receiving Yards")); add("ctd",N("Touchdowns")); add("yac",N("Yards After Catch")); add("drp",N("Drops")); add("trf",N("Catches In Traffic")); }
      else if (sec === "Cornerback"){ add("tkl",N("Tackles")); add("tfl",N("Tackles For Loss")); add("int",N("Interceptions")); add("itd",N("Interception TDs")); add("pbu",N("Pass Break Ups")); add("ca",N("Completions Allowed")); add("ctg",N("Targets")); add("ya",N("Passing Yards Allowed")); add("tda",N("Passing Touchdowns Allowed")); }
      else if (sec === "DLine"){ add("pr",N("Rushes")); add("sck",N("Sacks")); add("qbh",N("Quarterback Hits")); add("prs",N("QB Pressures")); add("ff",N("Fumbles Forced")); add("fr",N("Fumbles Recovered")); }
      else if (sec === "SpecialTeams"){ const fg = String(row["Field Goals"]||"0/0").split("/"); add("fgm",+fg[0]||0); add("fga",+fg[1]||0); add("kr",N("Kick Returns")); add("kry",N("Kick Return Yards")); add("krtd",N("Kick Return Touchdowns")); add("pnt",N("Punts")); add("in10",N("Punts In 10YD Line")); }
    }
    for (const u in out) if (!Object.keys(out[u]).length) delete out[u];
    return out;
  }

  // ---------- aggregation ----------
  const nm = u => roster[u]?.name || u;
  const jn = u => roster[u]?.number ?? "";
  function totals(){
    const t = {};
    for (const g of games){
      for (const u of (g.vikings||[])){
        const s = g.players?.[u]; if (!s) continue;
        const a = t[u] || (t[u] = {gp:0}); a.gp++;
        for (const k in s) a[k] = (a[k]||0) + s[k];
      }
    }
    for (const u in t){
      const a = t[u];
      a.cpct = a.att ? a.cmp/a.att*100 : null;
      a.rate = a.att ? rating(a) : null;
      a.ypr = a.rec ? a.cyd/a.rec : null;
      a.ypt = a.ctg ? (a.ya||0)/a.ctg : null;
      a.tds = (a.ctd||0)+(a.rtd||0)+(a.itd||0)+(a.krtd||0);
    }
    return t;
  }
  function rating(a){
    const c = x => Math.max(0, Math.min(2.375, x));
    const A = c((a.cmp/a.att - .3)*5), B = c(((a.pyd||0)/a.att - 3)*.25), C = c((a.ptd||0)/a.att*20), D = c(2.375 - (a.pint||0)/a.att*25);
    return (A+B+C+D)/6*100;
  }
  const f0 = v => v == null ? "–" : Math.round(v).toLocaleString();
  const f1 = v => v == null ? "–" : v.toFixed(1);

  const TABLES = {
    passing:{label:"Passing", show:a=>a.att, sort:"pyd", cols:[
      ["gp","GP",f0],["cmp","CMP",f0],["att","ATT",f0],["cpct","CMP%",f1],["pyd","YDS",f0],["ptd","TD",f0],["pint","INT",f0],["rate","RATE",f1],["sk","SACKED",f0]]},
    offense:{label:"Receiving & Rushing", show:a=>a.tgt||a.ra, sort:"cyd", cols:[
      ["gp","GP",f0],["rec","REC",f0],["tgt","TGT",f0],["cyd","REC YDS",f0],["ypr","Y/REC",f1],["ctd","REC TD",f0],["yac","YAC",f0],["trf","TRAFFIC",f0],["ra","RUSH",f0],["ryd","RUSH YDS",f0],["rtd","RUSH TD",f0]]},
    defense:{label:"Coverage", show:a=>a.tkl||a.ctg||a.int, sort:"int", cols:[
      ["gp","GP",f0],["tkl","TKL",f0],["tfl","TFL",f0],["int","INT",f0],["pbu","PBU",f0],["ctg","TGT",f0],["ca","CMP ALW",f0],["ya","YDS ALW",f0],["ypt","YDS/TGT",f1],["tda","TD ALW",f0]]},
    rush:{label:"Pass Rush", show:a=>a.pr||a.prs||a.sck, sort:"prs", cols:[
      ["gp","GP",f0],["pr","RUSHES",f0],["prs","PRESSURES",f0],["sck","SACKS",f0],["qbh","QB HITS",f0],["ff","FF",f0],["fr","FR",f0]]},
    st:{label:"Special Teams", show:a=>a.fga||a.kr||a.pnt, sort:"fgm", cols:[
      ["gp","GP",f0],["fgm","FG/XP MADE",f0],["fga","ATT",f0],["kr","KR",f0],["kry","KR YDS",f0],["krtd","KR TD",f0],["pnt","PUNTS",f0],["in10","INSIDE 10",f0]]},
  };
  const LEADERS = [["pyd","Passing Yards"],["cyd","Receiving Yards"],["tds","Touchdowns Scored"],["int","Interceptions"],["tkl","Tackles"],["prs","QB Pressures"]];

  function render(){
    const t = totals(), players = Object.keys(t);
    $("#sub").textContent = games.length ? `${games.length} game${games.length>1?"s":""} logged · ${players.length} Vikings on the stat sheet` : "No games logged yet";
    const sum = k => players.reduce((s,u)=>s+(t[u][k]||0),0);
    const tiles = [["Games", games.length],["Pass Yards", sum("pyd")],["Pass TDs", sum("ptd")],["Interceptions", sum("int")],["Tackles", sum("tkl")],["QB Pressures", sum("prs")]];
    $("#strip").innerHTML = tiles.map(([l,v])=>`<div class="tile"><b class="num">${f0(v)}</b><span>${l}</span></div>`).join("");
    $("#leaders").innerHTML = LEADERS.map(([k,l])=>{
      const top = players.filter(u=>t[u][k]).sort((a,b)=>t[b][k]-t[a][k]).slice(0,3);
      const rows = top.length ? top.map(u=>`<div class="lrow"><div class="jn">${esc(jn(u))||"–"}</div><div class="nm">${esc(nm(u))}</div><div class="v num">${f0(t[u][k])}</div></div>`).join("") : `<div class="muted">No stats yet</div>`;
      return `<div class="lcard"><h3>${l}</h3>${rows}</div>`;
    }).join("");
    $("#tabs").innerHTML = Object.entries(TABLES).map(([k,v])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${v.label}</button>`).join("");
    const T = TABLES[tab], sk = sortKey || T.sort;
    const rows = players.filter(u=>T.show(t[u])).sort((a,b)=>(t[b][sk]??-1)-(t[a][sk]??-1));
    $("#table").innerHTML = rows.length ? `<table><thead><tr><th data-k="name">Player</th>${T.cols.map(([k,l])=>`<th data-k="${k}" class="${k===sk?"sorted":""}">${l}</th>`).join("")}</tr></thead><tbody>${
      rows.map(u=>`<tr><td><span class="jn">${esc(jn(u))}</span>${esc(nm(u))}</td>${T.cols.map(([k,,fm])=>`<td>${fm(t[u][k])}</td>`).join("")}</tr>`).join("")
    }</tbody></table>` : `<div class="empty">No ${T.label.toLowerCase()} stats yet.</div>`;
    $("#gcount").textContent = games.length ? `${games.length} logged` : "";
    $("#games").innerHTML = games.length ? games.slice().reverse().map(g=>`<div class="game"><div class="ghead"><div><div class="gtitle">${esc(g.title)}</div><div class="gmeta">${esc(g.date||"")}</div></div></div><div class="chips">${g.vikings.map(u=>`<span class="chip">${esc(nm(u))}</span>`).join("")}</div></div>`).join("")
      : `<div class="empty">No games yet.</div>`;
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (b){ tab=b.dataset.tab; sortKey=null; render(); return; }
    const th = e.target.closest("#table th[data-k]"); if (th && th.dataset.k!=="name"){ sortKey=th.dataset.k; render(); }
  });

  // ---------- load: config.json + every CSV in /games ----------
  async function listFiles(cfg){
    const h = location.hostname, parts = location.pathname.split("/").filter(Boolean);
    if (h.endsWith(".github.io")){
      const owner = h.split(".")[0], repo = parts[0] || h;
      try{
        const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/games`, {cache:"no-store"});
        if (r.ok) return (await r.json()).filter(f=>/\.csv$/i.test(f.name)).map(f=>f.name);
      }catch{}
    }
    return cfg.files || Object.keys(cfg.games||{});
  }
  function meta(file){
    const base = file.replace(/\.csv$/i,"");
    const m = base.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);
    return m ? {date:m[1], title:m[2]||"Game"} : {date:"", title:base};
  }
  (async () => {
    try{
      const cfg = await (await fetch("config.json", {cache:"no-store"})).json();
      roster = cfg.roster || {};
      const files = (await listFiles(cfg)).sort();
      const loaded = await Promise.all(files.map(async f => {
        const r = await fetch("games/" + encodeURIComponent(f), {cache:"no-store"});
        if (!r.ok) return null;
        const players = parseCSV(await r.text()), o = (cfg.games||{})[f] || {}, not = new Set(o.notVikings||[]);
        const vikings = Object.keys(players).filter(u => (roster[u] && !not.has(u)) || (o.alsoVikings||[]).includes(u));
        return {...meta(f), ...(o.title?{title:o.title}:{}), players, vikings};
      }));
      games = loaded.filter(Boolean);
      render();
    }catch(e){
      $("#sub").textContent = "Couldn't load the stats. Refresh the page to try again.";
    }
  })();
  render();
})();
</script>
</body></html>
